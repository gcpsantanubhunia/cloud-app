name: Deploy to GCP

on:
  push:
    branches:
      - main

jobs:
  job_id:
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - uses: 'actions/checkout@v4'

    - uses: 'google-github-actions/auth@v3'
      with:
        workload_identity_provider: 'projects/655013047629/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'my-service-account@my-project.iam.gserviceaccount.com'

    - id: 'deploy'
      uses: 'google-github-actions/deploy-cloudrun@v3'
      with:
        service: 'hello-cloud-run'
        image: 'gcr.io/gcp-cloudrun-gke/cloud-app:v1'

    - name: 'Use output'
      run: 'curl "${{ steps.deploy.outputs.url }}"'