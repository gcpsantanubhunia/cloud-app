name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  REGION: us-central1
  SERVICE_NAME: cloud-run-service
  REPO_NAME: cloud-run-repo

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Required permissions for WIF OIDC federation
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Authenticate to GCP using Workload Identity Federation
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: "projects/655013047629/locations/global/workloadIdentityPools/github-pool-2/providers/github-provider-2"
        service_account: "github-deployer@$gcp-cloudrun-gke.iam.gserviceaccount.com"

    # # Log in to Artifact Registry using short-lived WIF credentials
    # - name: Docker Auth
    #   run: |
    #     gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

    # # Build and Push Container to GCP Artifact Registry
    # - name: Build and Push Container
    #   run: |
    #     IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
    #     docker build -t "$IMAGE_TAG" .
    #     docker push "$IMAGE_TAG"
    #     echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

    # Deploy the image to Google Cloud Run
    - name: Deploy to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: ${{ env.SERVICE_NAME }}
        region: ${{ env.REGION }}
        image: 'gcr.io/gcp-cloudrun-gke/cloud-app:v1'
        # Optional: allows unauthenticated public traffic to your Cloud Run service
        flags: '--allow-unauthenticated' 
