name: Build and Deploy to Cloud Run

# on:
#   push:
#     branches:
#       - main
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write 
env:
  SERVICE: "cloud-run-service"
  PROJECT_ID: "cloud-app-net"
  REGION: "us-central1"
  IMAGE: cloud-app  
  # IMAGE_TAG="$gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE }}:${{ github.sha }}"
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

      # Authenticate to GCP using Workload Identity Federation
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: "projects/149074426396/locations/global/workloadIdentityPools/githubpool/providers/githubprovider"
        service_account: "github-actions-sa@cloud-app-net.iam.gserviceaccount.com"

    - name: 'Docker Auth'
      uses: 'docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567' # docker/login-action@v3
      with:
        username: 'oauth2accesstoken'
        password: '${{ steps.auth.outputs.auth_token }}'
        registry: '${{ env.REGION }}-docker.pkg.dev'

    - name: 'Build and Push Container'
      run: |-
        DOCKER_TAG="$${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}:${{ github.sha }}"
        docker build --tag "${DOCKER_TAG}" .
        docker push "${DOCKER_TAG}"


    # Deploy the freshly built image to Cloud Run
    - name: Deploy to Cloud Run
      id: deploy-run
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: ${{ env.SERVICE }}
        region: ${{ env.REGION }}
        image: '${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}:${{ github.sha }}'
        # Optional parameters:
        flags: '--allow-unauthenticated --memory=512Mi'

    # Output the live Cloud Run deployment URL
    - name: Show Cloud Run URL
      run: | 
        echo "Your application is live at ${{ steps.deploy-run.outputs.url }}"

